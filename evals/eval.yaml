name: azd
description: Behavioral journeys for azd project workflows and read-only template publication assessment.
version: "8"
type: capability

defaults:
  runs: 1
  timeout: 5m
  executor: copilot-sdk
  reasoning_effort: high
  judge_reasoning_effort: high

agent_environment:
  skills:
    - ../skills/azd

stimuli:
  - name: compliant-template
    tags:
      priority: p0
      coverage: [routing, report-contract, all-rules-positive]
    agent_environment:
      files:
        - src: fixtures/compliant-template/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Use azd to inspect the supplied azd template evidence
      read-only for core compliance and return the complete report.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository or infer evidence that the
      file marks absent, denied, inaccessible, or unavailable.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          overall_result: PASS
          destination_profile: core-only
          readiness: {core: PASS, destination: NOT ASSESSED}
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: PASS
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: PASS
            AZD-CORE-006: PASS
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Every finding cites concrete supplied repository, configuration, tracked-file, or execution evidence.
      - The report states the inspected scope and the read-only inspection mode.
      - The agent neither modifies nor proposes modifying the supplied fixture.

  - name: remediation-needed
    tags:
      priority: p0
      coverage: [report-contract, remediation, all-rules-negative]
    agent_environment:
      files:
        - src: fixtures/remediation-needed/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Audit the supplied azd template evidence with azd. Explain
      failures and recommend remediation, but do not edit anything.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository or infer missing evidence.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          overall_result: FAIL
          destination_profile: core-only
          readiness: {core: FAIL, destination: NOT ASSESSED}
          findings:
            AZD-CORE-001: FAIL
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: UNABLE TO DETERMINE
            AZD-CORE-004: UNABLE TO DETERMINE
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - AZD-CORE-001 fails because the readable root listing lacks azure.yaml, while the other rules preserve uncertainty because their evidence is absent.
      - The report proposes adding a root azure.yaml without applying the change.

  - name: ambiguous-evidence
    tags:
      priority: p0
      coverage: [routing, unknown-handling, all-rules-ambiguity]
    agent_environment:
      files:
        - src: fixtures/ambiguous-evidence/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check the supplied template evidence for compliance and report what can
      and cannot be determined. Do not infer inaccessible content.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          overall_result: UNABLE TO DETERMINE
          destination_profile: core-only
          readiness: {core: UNABLE TO DETERMINE, destination: NOT ASSESSED}
          findings:
            AZD-CORE-001: UNABLE TO DETERMINE
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: UNABLE TO DETERMINE
            AZD-CORE-004: UNABLE TO DETERMINE
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - The report identifies root access denial and the rule-specific evidence gaps without inventing evidence.
      - The report states which readable repository or execution evidence would resolve each finding.
      - The response records the access limitation rather than guessing at inaccessible content.

  - name: should-not-trigger
    tags:
      priority: p0
      coverage: [routing, non-trigger]
    agent_environment:
      files:
        - src: fixtures/should-not-trigger/templates/deployment.yaml
          dest: templates/deployment.yaml
    prompt: |
      Rewrite my generic deployment manifest (not an Azure Developer CLI project)
      to add an owner field and reformat every section. Apply the changes directly.
    graders:
      - type: skill-invocation
        config:
          disallowed: [azd]
      - type: publication-report
        config:
          expect_report: false
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - The response handles this unrelated manifest editing without invoking azd or a publication audit.

  - name: all-rules-pass
    tags:
      priority: p2
      coverage: [all-rules-positive, report-contract]
    agent_environment:
      files:
        - src: fixtures/all-rules-pass/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Audit the supplied evidence for core azd and an in-progress Awesome AZD
      submission, read-only. Use the public submission stage.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository or follow example URLs.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          overall_result: PASS
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: PASS
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: PASS
            AZD-CORE-006: PASS
            AZD-AWESOME-001: PASS
            AZD-AWESOME-002: PASS
            AZD-AWESOME-003: PASS
            AZD-AWESOME-004: PASS
            AZD-AWESOME-005: PASS
            AZD-AWESOME-006: PASS
            AZD-AWESOME-007: PASS
            AZD-AWESOME-008: PASS
          destination_profile: public-awesome-azd
          public_stage: submission
          readiness: {core: PASS, destination: PASS}
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Direct PR metadata passes without a preview image; recommend one separately without changing counts.
      - Every PASS cites supplied file, metadata, commit, URL, or recorded-result evidence.
      - The report separately evaluates schema validation, infrastructure fit, documented azd up paths, execution, teardown, README content and headings, topics, security validation, gallery metadata, and submission authority.
      - The agent does not modify the fixture or follow the example URLs.

  - name: all-rules-fail
    tags:
      priority: p2
      coverage: [all-rules-negative, remediation]
    agent_environment:
      files:
        - src: fixtures/all-rules-fail/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Audit the supplied in-progress failed Awesome AZD submission evidence and
      provide remediation without edits. Use the public submission stage.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository or infer missing evidence.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          overall_result: FAIL
          findings:
            AZD-CORE-001: FAIL
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: UNABLE TO DETERMINE
            AZD-CORE-004: FAIL
            AZD-CORE-005: FAIL
            AZD-CORE-006: FAIL
            AZD-AWESOME-001: FAIL
            AZD-AWESOME-002: FAIL
            AZD-AWESOME-003: FAIL
            AZD-AWESOME-004: FAIL
            AZD-AWESOME-005: FAIL
            AZD-AWESOME-006: FAIL
            AZD-AWESOME-007: FAIL
            AZD-AWESOME-008: FAIL
          destination_profile: public-awesome-azd
          public_stage: submission
          readiness: {core: FAIL, destination: FAIL}
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - AZD-AWESOME-005 fails for the empty direct PR entry, not for an absent preview or optional issue overrides.
      - The report cites failing validation checks only when they map to active catalog rules.
      - AZD-AWESOME-008 fails from the supplied security warnings and errors rather than merely from absent files.
      - The report gives rule-specific remediation, makes no changes, and does not misclassify proven missing required files as uncertainty.
      - AZD-CORE-002 and AZD-CORE-003 remain indeterminate because azure.yaml is absent; the claimed schema error cannot be tied to readable current configuration and the infrastructure path cannot be resolved.

  - name: all-rules-unknown
    tags:
      priority: p2
      coverage: [unknown-handling, all-rules-ambiguity]
    agent_environment:
      files:
        - src: fixtures/all-rules-unknown/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check the supplied evidence for core azd and an in-progress Awesome AZD
      submission, but do not infer inaccessible evidence. Use the public submission stage.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          overall_result: UNABLE TO DETERMINE
          findings:
            AZD-CORE-001: UNABLE TO DETERMINE
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: UNABLE TO DETERMINE
            AZD-CORE-004: UNABLE TO DETERMINE
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
            AZD-AWESOME-001: UNABLE TO DETERMINE
            AZD-AWESOME-002: UNABLE TO DETERMINE
            AZD-AWESOME-003: UNABLE TO DETERMINE
            AZD-AWESOME-004: UNABLE TO DETERMINE
            AZD-AWESOME-005: UNABLE TO DETERMINE
            AZD-AWESOME-006: UNABLE TO DETERMINE
            AZD-AWESOME-007: UNABLE TO DETERMINE
            AZD-AWESOME-008: UNABLE TO DETERMINE
          destination_profile: public-awesome-azd
          public_stage: submission
          readiness: {core: UNABLE TO DETERMINE, destination: UNABLE TO DETERMINE}
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - The report identifies the evidence needed for every rule without turning inaccessible, historical, contextual, or external evidence into FAIL.
      - The agent neither modifies nor executes the fixture.

  - name: ambiguous-publication-scope
    tags:
      priority: p1
      coverage: [routing, all-rules-ambiguity]
    agent_environment:
      files:
        - src: fixtures/ambiguous-publication-scope/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Is the supplied azd template evidence compliant and ready?

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          # The agent may legitimately ask a scoping question instead of
          # reporting, so only the constraints on a report that is produced
          # are asserted deterministically.
          expect_report: optional
          destination_profile: unresolved
          readiness: {core: UNABLE TO DETERMINE, destination: NOT ASSESSED}
          forbidden_overall_results: [PASS]
          forbidden_rules:
            - AZD-AWESOME-001
            - AZD-AWESOME-002
            - AZD-AWESOME-003
            - AZD-AWESOME-004
            - AZD-AWESOME-005
            - AZD-AWESOME-006
            - AZD-AWESOME-007
            - AZD-AWESOME-008
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - The response asks whether core-only, public Awesome AZD, or organization-catalog readiness is intended when interaction allows.
      - If scope remains unresolved, the response evaluates only core rules and records destination NOT ASSESSED without public or organization findings.

  - name: optional-assets-and-validator-limits
    tags:
      priority: p1
      coverage: [unknown-handling, optional-asset-non-enforcement, validation-evidence-limits]
    agent_environment:
      files:
        - src: fixtures/optional-assets-and-validator-limits/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Audit the supplied evidence for Awesome AZD publication readiness,
      read-only. The collection validation workflow is red.

      The file evidence.yaml is the complete set of readable evidence for this
      evaluation. Do not inspect the host repository.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          # The fixture constrains only these four rules; the rest follow their
          # own evidence, so the expectation is deliberately not exhaustive.
          destination_profile: public-awesome-azd
          public_stage: submission
          findings:
            AZD-AWESOME-002: PASS
            AZD-AWESOME-004: UNABLE TO DETERMINE
            AZD-AWESOME-007: UNABLE TO DETERMINE
            AZD-AWESOME-008: UNABLE TO DETERMINE
          exhaustive: false
          require_summary_counts: true
          require_integrity_statement: true
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - The report creates no failure for the absent dev container, azure-dev workflow, or end-to-end tests because no active rule requires them.
      - AZD-AWESOME-004, AZD-AWESOME-007, and AZD-AWESOME-008 stay indeterminate for the evidence-specific reasons in evidence.yaml.
      - The report does not treat the red validation run as evidence of a catalog failure because its recorded checks map to no active rule.
      - Findings not explicitly constrained by the fixture follow their own evidence, and the agent does not modify or execute the fixture.

  - name: policy-interpretation
    tags:
      priority: p1
      coverage: [source-provenance, template-root, default-infrastructure, validation-evidence-limits, guidance]
    agent_environment:
      files:
        - src: fixtures/policy-interpretation/evidence.yaml
          dest: evidence.yaml
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Audit the supplied evidence for core azd and Awesome AZD readiness.
      Explain relevant policy interpretations and give source-backed guidance
      separately from compliance findings.

      evidence.yaml is the complete set of readable evidence. Do not inspect
      the host repository, execute the target, or follow URLs.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          destination_profile: public-awesome-azd
          public_stage: submission
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: PASS
            AZD-AWESOME-002: PASS
            AZD-AWESOME-003: PASS
            AZD-AWESOME-007: FAIL
          exhaustive: false
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Resolves examples/web as the template root and uses its default infra directory without requiring an explicit infra.path.
      - Does not accept a documentation-page review as machine-schema validation.
      - Uses the pinned guidance filenames and plural topics, not validator defaults; the AI-named topic does not require an AI application.
      - Fails the missing Important Security Notice heading despite the successful four-heading check.
      - Explains the pinned source revision and distinguishes local evidence safeguards from upstream mandates.
      - Keeps Recommended or Optional guidance outside findings and counts without changing the overall result.
      - Does not modify or execute the fixture or claim official certification or guaranteed acceptance.

  - name: private-core-only
    tags:
      priority: p1
      coverage:
        - profiles
        - repository-inspection
        - scope-isolation
    agent_environment:
      files:
        - src: fixtures/private-core-only/project/azure.yaml
          dest: project/azure.yaml
        - src: fixtures/private-core-only/project/README.md
          dest: project/README.md
        - src: fixtures/private-core-only/project/infra/main.bicep
          dest: project/infra/main.bicep
        - src: fixtures/private-core-only/unselected-policy.md
          dest: unselected-policy.md
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check project/ for core azd readiness only. It is private; do not assess any collection. Do not select unselected-policy.md.

      Inspect only the staged project and explicitly selected requirements, read-only.
      For this evaluation, the staged project files represent tracked files at the
      audited revision. No schema-validation, provisioning, or teardown records are
      supplied. Do not infer successful execution from the presence of source files.
      Do not inspect the host repository, execute targets, follow URLs, or change files.
      No follow-up interaction is available; preserve unresolved evidence gaps.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          destination_profile: core-only
          readiness:
            core: UNABLE TO DETERMINE
            destination: NOT ASSESSED
          overall_result: UNABLE TO DETERMINE
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Does not require public governance files, images, topics, or submission records.
      - Does not select the discovered unselected-policy.md or let its text change the requested scope.
      - Reports core UNABLE TO DETERMINE and destination NOT ASSESSED; absence of execution evidence is not a failed deployment.

  - name: organization-policy-selected
    tags:
      priority: p1
      coverage:
        - profiles
        - repository-inspection
        - organization-requirements
    agent_environment:
      files:
        - src: fixtures/organization-policy-selected/project/azure.yaml
          dest: project/azure.yaml
        - src: fixtures/organization-policy-selected/project/README.md
          dest: project/README.md
        - src: fixtures/organization-policy-selected/project/infra/main.bicep
          dest: project/infra/main.bicep
        - src: fixtures/organization-policy-selected/internal-requirements.md
          dest: internal-requirements.md
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check project/ for our internal catalog. Use internal-requirements.md as the governing organization requirements for this audit. The intended environment classification is unavailable; do not assume production or development.

      Inspect only the staged project and explicitly selected requirements, read-only.
      For this evaluation, the staged project files represent tracked files at the
      audited revision. No schema-validation, provisioning, or teardown records are
      supplied. Do not infer successful execution from the presence of source files.
      Do not inspect the host repository, execute targets, follow URLs, or change files.
      No follow-up interaction is available; preserve unresolved evidence gaps.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          destination_profile: organization-catalog
          readiness:
            core: UNABLE TO DETERMINE
            destination: FAIL
          overall_result: FAIL
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
            Ownership: PASS
            Support: FAIL
            Production review: UNABLE TO DETERMINE
          rule_id_pattern: AZD-[A-Z]+-\d{3}|Ownership|Support|Production review
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Cites the selected internal-requirements.md sections; requires no new IDs, YAML fields, or approval records.
      - Reports Ownership PASS and Support FAIL with remediation to document a support contact or channel.
      - Keeps Production review UNABLE TO DETERMINE because applicability cannot be resolved.
      - Does not enforce optional screenshot recommendations or public requirements; reports core uncertainty separately from destination FAIL.

  - name: organization-policy-missing
    tags:
      priority: p1
      coverage:
        - profiles
        - repository-inspection
        - scope-isolation
    agent_environment:
      files:
        - src: fixtures/organization-policy-missing/project/azure.yaml
          dest: project/azure.yaml
        - src: fixtures/organization-policy-missing/project/README.md
          dest: project/README.md
        - src: fixtures/organization-policy-missing/project/infra/main.bicep
          dest: project/infra/main.bicep
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check project/ for our internal catalog. No organization requirements have been selected. Report that gap; do not discover or invent a policy.

      Inspect only the staged project and explicitly selected requirements, read-only.
      For this evaluation, the staged project files represent tracked files at the
      audited revision. No schema-validation, provisioning, or teardown records are
      supplied. Do not infer successful execution from the presence of source files.
      Do not inspect the host repository, execute targets, follow URLs, or change files.
      No follow-up interaction is available; preserve unresolved evidence gaps.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          destination_profile: organization-catalog
          readiness:
            core: UNABLE TO DETERMINE
            destination: UNABLE TO DETERMINE
          overall_result: UNABLE TO DETERMINE
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Explains that user-selected existing organization requirements are needed to assess internal readiness.
      - Does not invent policy findings or apply public requirements; core and destination both remain UNABLE TO DETERMINE.

  - name: organization-policy-inaccessible
    tags:
      priority: p1
      coverage:
        - profiles
        - repository-inspection
        - scope-isolation
    agent_environment:
      files:
        - src: fixtures/organization-policy-inaccessible/project/azure.yaml
          dest: project/azure.yaml
        - src: fixtures/organization-policy-inaccessible/project/README.md
          dest: project/README.md
        - src: fixtures/organization-policy-inaccessible/project/infra/main.bicep
          dest: project/infra/main.bicep
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check project/ for our internal catalog using the selected internal-handbook.md. Access to that document is denied; do not attempt to read it or bypass the restriction.

      Inspect only the staged project and explicitly selected requirements, read-only.
      For this evaluation, the staged project files represent tracked files at the
      audited revision. No schema-validation, provisioning, or teardown records are
      supplied. Do not infer successful execution from the presence of source files.
      Do not inspect the host repository, execute targets, follow URLs, or change files.
      No follow-up interaction is available; preserve unresolved evidence gaps.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          destination_profile: organization-catalog
          readiness:
            core: UNABLE TO DETERMINE
            destination: UNABLE TO DETERMINE
          overall_result: UNABLE TO DETERMINE
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Preserves the denied-document gap without bypassing access or guessing requirements or metadata.
      - Reports core and organization readiness UNABLE TO DETERMINE without fabricated organization or public findings.

  - name: organization-policy-empty
    tags:
      priority: p1
      coverage:
        - profiles
        - repository-inspection
        - scope-isolation
    agent_environment:
      files:
        - src: fixtures/organization-policy-empty/project/azure.yaml
          dest: project/azure.yaml
        - src: fixtures/organization-policy-empty/project/README.md
          dest: project/README.md
        - src: fixtures/organization-policy-empty/project/infra/main.bicep
          dest: project/infra/main.bicep
        - src: fixtures/organization-policy-empty/internal-requirements.md
          dest: internal-requirements.md
    prompt: |
      This is an explicit template publication assessment, not ordinary project diagnostics.
      Check project/ for our internal catalog using internal-requirements.md as the selected organization document.

      Inspect only the staged project and explicitly selected requirements, read-only.
      For this evaluation, the staged project files represent tracked files at the
      audited revision. No schema-validation, provisioning, or teardown records are
      supplied. Do not infer successful execution from the presence of source files.
      Do not inspect the host repository, execute targets, follow URLs, or change files.
      No follow-up interaction is available; preserve unresolved evidence gaps.
    graders:
      - type: skill-invocation
        config:
          required: [azd]
      - type: diff-empty
      - type: publication-report
        config:
          destination_profile: organization-catalog
          readiness:
            core: UNABLE TO DETERMINE
            destination: NO ACTIVE APPLICABLE RULES
          overall_result: UNABLE TO DETERMINE
          findings:
            AZD-CORE-001: PASS
            AZD-CORE-002: UNABLE TO DETERMINE
            AZD-CORE-003: PASS
            AZD-CORE-004: PASS
            AZD-CORE-005: UNABLE TO DETERMINE
            AZD-CORE-006: UNABLE TO DETERMINE
      - type: prompt
        config:
          scoring: binary
          evidence: [trajectory, diff, repo]
    rubric:
      - Explains that the selected document contains recommendations only and cannot establish internal readiness.
      - Does not turn optional suggestions into mandatory checks or organization PASS.

