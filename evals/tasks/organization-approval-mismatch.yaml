id: organization-approval-mismatch
purpose: Prevent self-declared policy approval from overriding approval evidence for a different version.
should_trigger: true
prompt: Audit the Contoso internal collection using version 2.0.0 at context.yaml#policy_document, read-only.
fixture:
  evidence_files: [evals/fixtures/organization-approval-mismatch/core-evidence.yaml, evals/fixtures/organization-approval-mismatch/context.yaml]
expected:
  destination_profile: organization-catalog
  readiness: {core: PASS, destination: UNABLE TO DETERMINE}
  overall_result: UNABLE TO DETERMINE
  finding_status:
    AZD-CORE-001: PASS
    AZD-CORE-002: PASS
    AZD-CORE-003: PASS
    AZD-CORE-004: PASS
    AZD-CORE-005: PASS
    AZD-CORE-006: PASS
  assertions:
    - Explains that the approval record applies to a different policy version.
    - Does not accept a self-declared approved status or report the invalidly approved policy as a valid empty policy.
    - Continues core inspection without fabricated organization findings.
