id: should-not-trigger
purpose: Verify unrelated manifest editing does not route to the azd skill.
should_trigger: false
prompt: >-
  Rewrite my generic deployment manifest (not an Azure Developer CLI project)
  to add an owner field and reformat every section. Apply the changes directly.
fixture:
  target:
    path: templates/deployment.yaml
    content: |
      metadata: {}
expected:
  assertions:
    - Does not invoke azd for unrelated manifest editing.
    - Does not present a compliance verdict.
    - Routes to a template editing or generation capability if one is available.
