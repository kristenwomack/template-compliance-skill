  readme:
    content: |
      # Python App Service template

      ## Important Security Notice
      This template helps you get started on Azure. Review authentication,
      secrets handling, and networking before production use.

      ## Features
      Creates an Azure App Service plan and web app and deploys the Python
      application from `src/app.py`.

      ## Getting Started

      ### Prerequisites
      Install Azure Developer CLI 1.9 or later and use an Azure subscription
      where you can create App Service resources.

      ### Quickstart
      Run `azd auth login`, `azd init`, and `azd up`. The documented `azd up`
      path reads `azure.yaml`, `infra/main.bicep`, and `src/app.py`.

      Verify the deployment by opening the HTTPS endpoint printed by
      `azd up`; the page must display "Hello from the Python App Service
      template."

      Clean up by running `azd down` and confirming deletion when prompted.

      ## Guidance

      ### Security
      The web app authenticates to Azure with a system-assigned managed
      identity; no secrets are stored in the repository.

      ## Resources
      - Azure App Service documentation
